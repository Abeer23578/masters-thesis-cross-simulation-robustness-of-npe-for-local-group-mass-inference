[project]
name = "local-group-mass-inference"
version = "0.1.0"
description = "Cross-simulation robustness of neural posterior estimation for Local Group mass inference"
authors = [{name = "Abeer Ayyaz"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "matplotlib>=3.8", "jupyterlab>=4", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6", "tabulate>=0.9"]

[tool.setuptools.packages.find]
where = ["research/src"]
